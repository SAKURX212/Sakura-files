plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sakura.filemanager'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sakura.filemanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
